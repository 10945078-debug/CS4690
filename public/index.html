<!DOCTYPE html>
<html lang="en-US" data-theme="light">
  <head>
    <meta name="viewport" content="width=device-width"/>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Student Logs</title>
    <img src="https://www.uvu.edu/favicon.ico" alt="UVU favicon" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      :root {
        --bs-primary: #008a40; /* Wolverine Green */
        --uvu-dark: #013220;
      }
      body { font-family: 'Roboto', sans-serif; transition: all 0.3s ease; }
      h3 { font-family: 'Rajdhani', sans-serif; }
      /* The one CSS rule you should keep for the logo flip */
      [data-bs-theme='dark'] .uvu-logo { filter: brightness(0) invert(1); }
    </style>
  </head>
  <body class="bg-body text-body">
    <nav class="navbar px-4 py-2 border-bottom border-4" style="background-color: var(--uvu-dark); border-color: var(--uvu-dark) !important;">
      <div class="container-fluid d-flex justify-content-between align-items-center">
        <img
          src="https://www.uvu.edu/about/images/section_6/uvu_monogram_white.png"
          alt="Utah Valley University"
          class="uvu-logo" 
          style="height: 40px; width: auto;"
        />
      </div>
      <div class="theme-controls">
        <button id="theme-toggle" class="btn btn-outline-light fw-bold text-uppercase" aria-label="Toggle Dark Mode">
          <span class="mode-text">Dark Mode</span>
        </button>
      </div>
    </nav>
    <main class="container py-5 mt-4 text-center" style="max-width: 600px; min-height: 80vh;">
      <form class="card p-4 shadow-sm bg-light-subtle">
        <div class="mb-3 text-start">
          <label for="course" class="form-label fw-bold">Select Course</label>
          <select class="form-select" id="course" name="course" data-cy="course_select">
            </select>
        </div>

        <div class="mb-3 text-start">
          <label for="uvuId" class="form-label fw-bold">UVU ID</label>
          <input type="text" class="form-control" id="uvuId" name="uvuId" 
                 placeholder="10234567" minlength="8" maxlength="8" data-cy="uvuId_input">
        </div>

        <h3 id="uvuIdDisplay" class="text-primary mt-3" data-cy="uvuIdDisplay"></h3>
        <ul id="logs" class="list-group my-3 text-start" data-cy="logs">
        </ul>

        <div class="mb-3 text-start">
          <label class="form-label fw-bold">New Log
            <textarea class="form-control" id="log_textarea" rows="3" data-cy="log_textarea"></textarea>
          </label>
        </div>

        <button disabled type="submit" id="log_btn" class="btn btn-primary w-100 fw-bold text-uppercase" data-cy="add_log_btn">
          Add Log
        </button>
      </form>
    </main>
    <!-- import for axios to work in script.js -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module" src="script.js"></script>
  </body>
</html>
