<!DOCTYPE html>
<html lang="en-US" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Student Logs</title>
    <img src="https://www.uvu.edu/favicon.ico" alt="UVU favicon" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body id="body">
    <nav class="navbar">
      <div class="logo-container">
        <img
          src="https://www.uvu.edu/about/images/section_6/uvu_monogram_white.png"
          alt="Utah Valley University"
          class="uvu-logo"
        />
      </div>
      <div class="theme-controls">
        <button id="theme-toggle" aria-label="Toggle Dark Mode">
          <span class="mode-text">Dark Mode</span>
        </button>
      </div>
    </nav>
    <form>
      <select
        aria-label="Select Course"
        id="course"
        name="course"
        data-cy="course_select"
      ></select
      ><br />

      <label for="uvuId">UVU ID</label><br />
      <input
        type="text"
        inputmode="numeric"
        pattern="[0-9*]"
        id="uvuId"
        name="uvuId"
        placeholder="10234567"
        minlength="8"
        maxlength="8"
        data-cy="uvuId_input"
      />
      <h3 id="uvuIdDisplay" data-cy="uvuIdDisplay"></h3>
      <ul id="logs" data-cy="logs">
      </ul>
      <label>New Log</label><br />
      <textarea
        id="log_textarea"
        style="height: 75px;"
        aria-label="add log textarea"
        data-cy="log_textarea"
      ></textarea
      ><br />
      <button
        disabled
        type="submit"
        id="log_btn"
        data-cy="add_log_btn"
      >
        Add Log
      </button>
    </form>
    <!-- import for axios to work in script.js -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
